<style>
/* Layout: libreta rosada — una columna de hasta 560px, encabezado con su nombre arriba, pestañas de app abajo y fichas tipo stickers */
:root {
  --bg: #fff5f7;
  --paper: #ffffff;
  --blush: #fde6ec;
  --line: #f3d3dd;
  --ink: #4b2a39;
  --ink-soft: #7f5868;
  --accent: #bf4d76;
  --accent-ink: #ffffff;
  --accent-soft: #fbd3df;
  --ok: #bfe8d1;
  --ok-ink: #1f4a34;
  --warn-bg: #fdf1cf;
  --scrim: rgba(75, 42, 57, .38);
  --shadow: 0 12px 28px -20px rgba(122, 70, 89, .6);

  /* fondo de cada dibujo (siempre pastel, como sticker) */
  --t-gruesa: #fbd0dc; --t-fina: #fde0cc; --t-lenguaje: #e7ddf8;
  --t-cognitivo: #d7e9f8; --t-sensorial: #d4efe0; --t-socio: #fad7ec;
  /* fondo de etiquetas */
  --c-gruesa: #fbd0dc; --c-fina: #fde0cc; --c-lenguaje: #e7ddf8;
  --c-cognitivo: #d7e9f8; --c-sensorial: #d4efe0; --c-socio: #fad7ec;
  /* punto de color por área */
  --d-gruesa: #e98aa7; --d-fina: #ee9c6e; --d-lenguaje: #a387da;
  --d-cognitivo: #72aadb; --d-sensorial: #62bb8c; --d-socio: #d87cb6;

  /* tinta y rellenos de las ilustraciones */
  --il-line: #7a4659; --il-pink: #f8c8d6; --il-rose: #ef9db5; --il-peach: #fbd2b6;
  --il-cream: #fff7f1; --il-lilac: #d9c9f3; --il-sky: #c3e0f6; --il-mint: #c2e9d3;
  --il-butter: #fbe7a1; --il-card: #e8c8a9;

  --f-display: "Grandstander", ui-rounded, "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #22161d; --paper: #2e1f28; --blush: #3b2631; --line: #4c303e;
    --ink: #fbe9f0; --ink-soft: #d4adbd; --accent: #f3a6c0; --accent-ink: #2a1520; --accent-soft: #5a3249;
    --ok: #2d4b3d; --ok-ink: #cdf2dd; --warn-bg: #46391f;
    --scrim: rgba(0, 0, 0, .58); --shadow: 0 12px 28px -20px rgba(0, 0, 0, .9);
    --t-gruesa: #edbccb; --t-fina: #efcfba; --t-lenguaje: #d6cbec;
    --t-cognitivo: #c3d9ec; --t-sensorial: #c1e0cf; --t-socio: #ebc4dc;
    --c-gruesa: #5a3243; --c-fina: #563a2e; --c-lenguaje: #41365c;
    --c-cognitivo: #2c4257; --c-sensorial: #2c4a3d; --c-socio: #53304e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #22161d; --paper: #2e1f28; --blush: #3b2631; --line: #4c303e;
  --ink: #fbe9f0; --ink-soft: #d4adbd; --accent: #f3a6c0; --accent-ink: #2a1520; --accent-soft: #5a3249;
  --ok: #2d4b3d; --ok-ink: #cdf2dd; --warn-bg: #46391f;
  --scrim: rgba(0, 0, 0, .58); --shadow: 0 12px 28px -20px rgba(0, 0, 0, .9);
  --t-gruesa: #edbccb; --t-fina: #efcfba; --t-lenguaje: #d6cbec;
  --t-cognitivo: #c3d9ec; --t-sensorial: #c1e0cf; --t-socio: #ebc4dc;
  --c-gruesa: #5a3243; --c-fina: #563a2e; --c-lenguaje: #41365c;
  --c-cognitivo: #2c4257; --c-sensorial: #2c4a3d; --c-socio: #53304e;
  color-scheme: dark;
}

[data-area="gruesa"]    { --tile: var(--t-gruesa);    --chip: var(--c-gruesa);    --dot: var(--d-gruesa); }
[data-area="fina"]      { --tile: var(--t-fina);      --chip: var(--c-fina);      --dot: var(--d-fina); }
[data-area="lenguaje"]  { --tile: var(--t-lenguaje);  --chip: var(--c-lenguaje);  --dot: var(--d-lenguaje); }
[data-area="cognitivo"] { --tile: var(--t-cognitivo); --chip: var(--c-cognitivo); --dot: var(--d-cognitivo); }
[data-area="sensorial"] { --tile: var(--t-sensorial); --chip: var(--c-sensorial); --dot: var(--d-sensorial); }
[data-area="socio"]     { --tile: var(--t-socio);     --chip: var(--c-socio);     --dot: var(--d-socio); }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
body.locked { overflow: hidden; }
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
svg { display: block; }

.wrap {
  max-width: 560px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- encabezado y pestañas ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.brand {
  display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink);
  font-family: var(--f-display); font-weight: 700; font-size: 1.375rem; letter-spacing: -.01em;
}
.brand svg { width: 38px; height: 38px; }
.age {
  margin-left: auto; font-size: .8125rem; font-weight: 800; white-space: nowrap;
  background: var(--accent-soft); color: var(--ink); padding: 4px 12px; border-radius: 999px;
}
main.wrap { padding-block: 4px calc(104px + env(safe-area-inset-bottom, 0px)); outline: none; }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--paper); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs .wrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding-block: 8px; }
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px;
  border-radius: 16px; color: var(--ink-soft); text-decoration: none; font-weight: 800; font-size: .75rem;
}
.tab svg { width: 26px; height: 26px; }
.tab[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }

/* ---------- textos ---------- */
.eyebrow {
  margin: 0; font-size: .75rem; font-weight: 800; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-soft);
}
.title {
  font-family: var(--f-display); font-weight: 700; font-size: clamp(1.75rem, 7vw, 2.125rem);
  line-height: 1.1; margin: .2em 0 .25em; text-wrap: balance;
}
.sub { margin: 0; color: var(--ink-soft); }
.hero { padding-block: 18px 6px; }

/* ---------- piezas comunes ---------- */
.tile {
  display: block; position: relative; width: 100%; aspect-ratio: 4 / 3; max-width: 100%;
  border: 0; padding: 0; border-radius: 16px; background: var(--tile, var(--blush)); overflow: hidden;
}
button.tile { cursor: pointer; }
.art { width: 100%; height: 100%; }
.badge {
  position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--ok); color: var(--ok-ink); display: grid; place-items: center;
  box-shadow: 0 0 0 2px var(--paper);
}
.badge svg { width: 15px; height: 15px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  background: var(--chip, var(--blush)); color: var(--ink); font-weight: 800; font-size: .75rem;
  padding: 3px 10px; border-radius: 999px;
}
.chip::before, .dot { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); flex: none; }
.chip b { font-variant-numeric: tabular-nums; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0; font-size: .8125rem; color: var(--ink-soft); }
.tag {
  font-size: .6875rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  background: var(--accent); color: var(--accent-ink); padding: 2px 8px; border-radius: 999px;
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 9px 16px;
  border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink);
  font-weight: 800; font-size: .875rem; cursor: pointer; transition: background .15s, transform .1s;
}
.btn:active { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--ok-ink); }
.btn.warn { background: var(--warn-bg); border-color: var(--warn-bg); }

/* ---------- Hoy ---------- */
.bar { height: 12px; border-radius: 999px; background: var(--blush); overflow: hidden; margin-top: 14px; }
.bar span { display: block; height: 100%; min-width: 12px; background: var(--accent); border-radius: inherit; transition: width .4s ease; }
.bar span[data-zero] { min-width: 0; }
.list { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 12px; }
.slot-card {
  display: grid; grid-template-columns: minmax(96px, 34%) minmax(0, 1fr); gap: 14px; align-items: start;
  background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 12px; box-shadow: var(--shadow);
}
.slot-card .tile { aspect-ratio: 1; }
.slot-card h3 { font-family: var(--f-display); font-weight: 700; font-size: 1.1875rem; line-height: 1.2; margin: 4px 0 6px; text-wrap: balance; }
.slot-card.is-done h3 { color: var(--ink-soft); }
.tile-empty { background: transparent; border: 2px dashed var(--line); display: grid; place-items: center; color: var(--ink-soft); }
.tile-empty svg { width: 34px; height: 34px; }
.tip { margin-top: 22px; background: var(--blush); border-radius: 22px; padding: 16px 18px; }
.tip h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; font-family: var(--f-display); font-size: 1.0625rem; }
.tip h2 svg { width: 20px; height: 20px; color: var(--accent); }
.tip p { margin: 0; max-width: 60ch; }

/* ---------- Semana ---------- */
.balance { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.days { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 12px; }
.day { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 12px; scroll-margin-top: 80px; }
.day.is-today { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.day-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.day-head h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.125rem; margin: 0; }
.day-head .date { color: var(--ink-soft); font-size: .8125rem; }
.day-head .count { margin-left: auto; font-size: .8125rem; font-weight: 800; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mini {
  display: flex; flex-direction: column; gap: 3px; min-width: 0; padding: 0; border: 0; background: none;
  text-align: left; cursor: pointer; border-radius: 14px;
}
.mini .tile { border-radius: 12px; }
.mini-m { font-size: .6875rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); margin-top: 2px; }
.mini-n {
  font-size: .8125rem; font-weight: 700; line-height: 1.25; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.mini.empty .tile { background: transparent; border: 2px dashed var(--line); display: grid; place-items: center; color: var(--ink-soft); }
.mini.empty .tile svg { width: 26px; height: 26px; }
.mini.empty .mini-n { color: var(--ink-soft); }
.week-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }

/* ---------- Juegos ---------- */
.filters {
  display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; margin: 14px -2px 0;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.filters::-webkit-scrollbar { display: none; }
.fchip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 38px;
  padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper);
  font-weight: 800; font-size: .8125rem; cursor: pointer;
}
.fchip[data-area]::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); }
.fchip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.grid { list-style: none; padding: 0; margin: 6px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.card {
  display: flex; flex-direction: column; gap: 6px; width: 100%; height: 100%; text-align: left;
  background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 8px 8px 12px; cursor: pointer;
}
.card .tile { border-radius: 14px; }
.card-n { font-family: var(--f-display); font-weight: 700; font-size: 1rem; line-height: 1.2; padding-inline: 4px; text-wrap: balance; }
.card-meta { display: flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--ink-soft); padding-inline: 4px; }

/* ---------- Hoja inferior ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; margin-inline: auto; max-width: 560px;
  max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--paper); border-radius: 26px 26px 0 0; box-shadow: 0 -16px 40px -24px rgba(0, 0, 0, .45);
  padding-top: 6px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  animation: up .24s ease-out;
}
@keyframes up { from { transform: translateY(28px); opacity: .5; } }
.grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 4px auto 6px; }
.sheet-head { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.x {
  margin-left: auto; width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--blush);
  display: grid; place-items: center; cursor: pointer; flex: none;
}
.x svg { width: 20px; height: 20px; }
.hero-art { border-radius: 22px; margin: 6px 0 14px; }
.sheet h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.625rem; line-height: 1.15; margin: 0 0 8px; text-wrap: balance; }
.sec { margin-top: 22px; }
.sec h3 { margin: 0 0 10px; font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.benefits { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.benefits li { display: flex; gap: 10px; align-items: flex-start; background: var(--blush); border-radius: 14px; padding: 9px 12px; font-weight: 700; }
.benefits svg { width: 18px; height: 18px; color: var(--accent); flex: none; margin-top: 3px; }
.materials { margin: 0; padding-left: 1.25em; display: grid; gap: 4px; }
.materials li::marker { color: var(--accent); }
.steps { list-style: none; counter-reset: paso; padding: 0; margin: 0; display: grid; gap: 12px; }
.steps li { counter-increment: paso; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: start; }
.steps li::before {
  content: counter(paso); width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--ink); font-family: var(--f-display); font-weight: 700;
}
.steps span { padding-top: 4px; }
.note { margin: 22px 0 0; border-radius: 16px; padding: 12px 14px; background: var(--blush); }
.note.care { background: var(--warn-bg); }

.adder { margin-top: 14px; padding: 14px; border-radius: 18px; background: var(--blush); display: grid; gap: 12px; }
.adder fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.adder legend { padding: 0; margin-bottom: 8px; font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt span {
  display: inline-flex; align-items: center; min-height: 38px; padding: 6px 13px; border-radius: 999px;
  background: var(--paper); border: 1.5px solid var(--line); font-weight: 800; font-size: .8125rem;
}
.opt input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.hint { margin: 0; font-size: .8125rem; color: var(--ink-soft); }

.pick { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 8px; }
.pick button {
  display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%;
  text-align: left; background: var(--paper); border: 1.5px solid var(--line); border-radius: 18px; padding: 6px 12px 6px 6px; cursor: pointer;
}
.pick button[aria-current="true"] { border-color: var(--accent); }
.pick .tile { border-radius: 12px; }
.pick-n { display: block; font-weight: 800; line-height: 1.25; }
.pick-a { display: block; font-size: .75rem; color: var(--ink-soft); }

.toast {
  position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  transform: translate(-50%, 8px); max-width: calc(100% - 32px); width: max-content;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px;
  font-weight: 800; font-size: .875rem; text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- trazos de los dibujos ---------- */
.l { stroke: var(--il-line); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.n { fill: none; }
.c-pk { fill: var(--il-pink); } .c-rs { fill: var(--il-rose); } .c-pc { fill: var(--il-peach); }
.c-cr { fill: var(--il-cream); } .c-li { fill: var(--il-lilac); } .c-sk { fill: var(--il-sky); }
.c-mn { fill: var(--il-mint); } .c-bt { fill: var(--il-butter); } .c-br { fill: var(--il-card); }
.c-ln { fill: var(--il-line); }
.sh { fill: var(--il-line); opacity: .12; }
.th { fill: none; stroke: var(--il-line); stroke-width: 1.5; opacity: .55; stroke-linecap: round; }
.tx { fill: none; stroke: var(--il-line); stroke-width: 3; opacity: .4; stroke-linecap: round; }
.dash { stroke-dasharray: 2 7; }
.sw { fill: none; stroke: var(--il-rose); stroke-width: 4; stroke-linecap: round; }
.stw { fill: none; stroke: var(--il-sky); stroke-width: 6; stroke-linecap: round; }
.sh2 { fill: none; stroke: var(--il-cream); stroke-width: 3; stroke-linecap: round; }
.beam { stroke: var(--il-line); stroke-width: 6; stroke-linecap: round; }
.fo { fill: none; stroke: var(--il-line); stroke-width: 10; stroke-linecap: round; }
.fi { fill: none; stroke: var(--il-peach); stroke-width: 5; stroke-linecap: round; }
.svt { font-family: var(--f-display); font-weight: 700; font-size: 15px; fill: var(--il-line); }
.svt.big { font-size: 34px; }

.swl { fill: none; stroke: var(--il-lilac); stroke-width: 4; stroke-linecap: round; }
.swm { fill: none; stroke: var(--il-mint); stroke-width: 4; }

/* ---------- v3: ajustes, día ocupado, resumen, materiales, diario ---------- */
.icon-btn {

}
.fav svg { width: 13px; height: 13px; }
.tag.new { position: absolute; top: 6px; left: 6px; }

.busy-toggle {
  display: grid; grid-template-columns: 38px minmax(0, 1fr) 46px; align-items: center; gap: 12px;
  width: 100%; margin-top: 14px; padding: 10px 14px 10px 10px; text-align: left; cursor: pointer;
  background: var(--paper); border: 1.5px solid var(--line); border-radius: 18px;
}
.busy-toggle strong { display: block; font-weight: 800; }
.busy-toggle small { display: block; color: var(--ink-soft); font-size: .8125rem; line-height: 1.3; }

.switch { width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--paper); box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }

.note-card { margin-top: 16px; background: var(--accent-soft); border-radius: 22px; padding: 14px 18px; }

.rate-btn[data-v="-1"][aria-pressed="true"] { background: var(--blush); border-color: var(--ink-soft); }

.ab-d { display: block; height: 100%; border-radius: inherit; background: var(--dot); }
.ab-v { text-align: right; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

.day.is-off { background: transparent; border-style: dashed; }

.mile { grid-template-columns: 26px minmax(0, 1fr) 8px; align-items: center; }

.field { display: grid; gap: 4px; min-width: 0; }

.diary-form .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }

.entries { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }

.sync-line { margin: 10px 0 0; font-size: .875rem; color: var(--ink-soft); }

.sec .actions + .hint, .times + .actions + .hint { margin-top: 8px; }

@media (min-width: 600px) {

@media (prefers-reduced-motion: reduce) {

<script>
(function () {
  'use strict';
  const KEY = 'aiuni-juega-v3', OLD_KEY = 'aiuni-juega-v2';
  const CFG = window.AIUNI_CFG || { build: 'artifact' };
  const IS_APP = CFG.build === 'pwa';
  const CAN_SYNC = IS_APP && !!CFG.sbUrl && !!CFG.sbKey;
  const $ = s => document.querySelector(s);
  const byId = Object.fromEntries(ACTIVITIES.map(a => [a.id, a]));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const withName = s => s.replace(/\{name\}/g, BABY.name);
  const AREA_KEYS = Object.keys(AREAS);

  const sv = (d, extra = '') => `<svg viewBox="0 0 24 24" aria-hidden="true"${extra}>${d}</svg>`;
  const st = 'fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"';
  const ICON = {
    check: sv('<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>'),

    people: sv(`<circle cx="9" cy="8" r="3.2" ${st}/><path d="M3.5 19.5c.6-3.3 2.8-5.2 5.5-5.2s4.9 1.9 5.5 5.2" ${st}/><circle cx="17" cy="9" r="2.5" ${st}/><path d="M16.5 14.4c2.3.1 3.7 1.8 4.2 4.6" ${st}/>`),
    copy: sv(`<rect x="8" y="8" width="12" height="12" rx="2.5" ${st}/><path d="M16 5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16" ${st}/>`),

    trash: sv(`<path d="M5 7h14M9.5 7V5h5v2M7 7l1 13h8l1-13" ${st}/>`),

  /* ---------- fechas y edad ---------- */
  const now = () => new Date();
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  function monday(d) { const x = startOfDay(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const fromIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const weekKeyOf = d => iso(monday(d));
  const weekKey = () => weekKeyOf(now());
  const nextWeekKey = () => iso(addDays(monday(now()), 7));
  const todayIso = () => iso(now());
  const todayIdx = () => (now().getDay() + 6) % 7;
  const dateOf = (wk, i) => addDays(fromIso(wk), i);
  const fmtLong = new Intl.DateTimeFormat('es-PE', { weekday: 'long', day: 'numeric', month: 'long' });
  const fmtShort = new Intl.DateTimeFormat('es-PE', { day: 'numeric', month: 'short' });
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const longDate = d => cap(fmtLong.format(d).replace(',', ''));
  const shortDate = d => fmtShort.format(d).replace('.', '');
  const dayName = k => DAYS.find(d => d.k === k).n;
  const momentName = s => MOMENTS[s].n.toLowerCase();
  function monthsAt(d) {
    const b = fromIso(BABY.birth);
    let m = (d.getFullYear() - b.getFullYear()) * 12 + (d.getMonth() - b.getMonth());
    if (d.getDate() < b.getDate()) m--;
    return Math.max(0, m);
  }
  const ageNow = () => monthsAt(now());
  const ageText = () => { const m = ageNow(); return m === 1 ? '1 mes' : `${m} meses`; };
  const fits = (a, m) => m >= a.age[0] && m <= a.age[1];
  const weekAge = wk => monthsAt(dateOf(wk, 6));
  function dayOfYear() { const n = now(); return Math.floor((startOfDay(n) - new Date(n.getFullYear(), 0, 1)) / 864e5); }
  function ago(t) {
    if (!t) return 'todavía no';
    const s = Math.round((Date.now() - t) / 1000);
    if (s < 60) return 'hace un momento';
    if (s < 3600) return `hace ${Math.round(s / 60)} min`;
    if (s < 86400) return `hace ${Math.round(s / 3600)} h`;
    return `el ${shortDate(new Date(t))}`;
  }

  /* ---------- estado ---------- */
  function cleanPlan(p) {
    const out = {};
    DAYS.forEach(d => {
      const row = p && Array.isArray(p[d.k]) ? p[d.k] : [null, null, null];
      out[d.k] = [0, 1, 2].map(i => (byId[row[i]] ? row[i] : null));
    });
    return out;
  }
  const obj = v => (v && typeof v === 'object' ? v : {});
  const normWeek = w => ({
    plan: cleanPlan(w && w.plan), done: obj(w && w.done), salt: Number.isInteger(w && w.salt) ? w.salt : 0,
    busy: obj(w && w.busy), mats: obj(w && w.mats), t: (w && w.t) || 0
  });
  const fresh = () => ({
    start: { v: BABY.start, t: 0 }, weeks: {}, ratings: {}, diary: {}, miles: {},
    family: null, rem: ['08:30', '16:00', '19:30'], lastSync: 0, dirty: false
  });
  let state = fresh();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      state = Object.assign(fresh(), s);
      ['weeks', 'ratings', 'diary', 'miles'].forEach(k => { state[k] = obj(state[k]); });
      Object.keys(state.weeks).forEach(k => { state.weeks[k] = normWeek(state.weeks[k]); });
      if (!state.start || !state.start.v) state.start = { v: BABY.start, t: 0 };
      if (!Array.isArray(state.rem) || state.rem.length !== 3) state.rem = fresh().rem;
    } else {
      const old = localStorage.getItem(OLD_KEY);
      if (old) {
        const o = JSON.parse(old);
        Object.keys(obj(o.weeks)).forEach(k => { state.weeks[k] = normWeek(o.weeks[k]); });
      }
    }
  } catch (e) { /* sin almacenamiento: la app funciona igual en esta sesión */ }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { } }
  function save() { state.dirty = true; persist(); queueSync(); }

  /* ---------- plan automático ---------- */
  function rng(seed) {
    return function () {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const hashStr = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  const weekNum = wk => Math.round(Date.parse(wk + 'T00:00:00Z') / (7 * 864e5));
  const rating = id => (state.ratings[id] ? state.ratings[id].v : 0);

  function autoPlan(wk, salt) {
    const r = rng(weekNum(wk) * 31 + salt * 7919 + 17);
    const months = weekAge(wk);
    const pools = MOMENTS.map(m => {
      const keyed = ACTIVITIES
        .filter(a => m.areas.includes(a.a) && a.id !== SUNDAY_WALK && fits(a, months))
        .map(a => ({ id: a.id, v: rating(a.id), k: r() + (rating(a.id) === 1 ? 0.45 : 0) + (a.age[0] > 12 && months - a.age[0] <= 1 ? 0.35 : 0) }))
        .sort((x, y) => y.k - x.k);
      const liked = keyed.filter(x => x.v !== -1);
      return (liked.length >= 4 ? liked : keyed).map(x => x.id);
    });
    const plan = {};
    DAYS.forEach((d, i) => {
      plan[d.k] = MOMENTS.map((m, s) => (s === 0 && d.k === 'dom' ? SUNDAY_WALK : (pools[s].length ? pools[s][i % pools[s].length] : null)));
    });
    return plan;
  }
  function getWeek(wk, store) {
    let w = state.weeks[wk];
    if (w) return w;
    w = normWeek({ plan: autoPlan(wk, 0) });
    if (store) {
      state.weeks[wk] = w;
      Object.keys(state.weeks).sort().slice(0, -16).forEach(k => delete state.weeks[k]);
      persist();
    }
    return w;
  }
  const isCurrentOrPast = wk => wk <= weekKey();
  function editWeek(wk) { const w = getWeek(wk, true); state.weeks[wk] = w; w.t = Date.now(); return w; }

  /* ---------- días activos, día ocupado, hecho ---------- */
  const startIso = () => state.start.v;
  const dayActive = (wk, i) => iso(dateOf(wk, i)) >= startIso();
  const canMark = (wk, i) => iso(dateOf(wk, i)) <= todayIso() && dayActive(wk, i);
  const isBusy = (w, day) => !!w.busy[day];
  function quickId(wk, i, slot) {
    const months = monthsAt(dateOf(wk, i));
    const list = QUICK[slot].filter(id => fits(byId[id], months));
    return list[hashStr(iso(dateOf(wk, i)) + slot) % list.length];
  }
  function slotId(wk, w, i, slot) { const d = DAYS[i].k; return isBusy(w, d) ? quickId(wk, i, slot) : w.plan[d][slot]; }
  const doneKey = (day, slot, q) => `${day}-${slot}${q ? 'q' : ''}`;
  const isDone = (w, day, slot) => !!w.done[doneKey(day, slot, isBusy(w, day))];

  function weekStats(wk) {
    const w = getWeek(wk, false);
    const areas = Object.fromEntries(AREA_KEYS.map(k => [k, { p: 0, d: 0 }]));
    let planned = 0, done = 0, busyDays = 0;
    DAYS.forEach((d, i) => {
      if (!dayActive(wk, i)) return;
      if (isBusy(w, d.k)) busyDays++;
      [0, 1, 2].forEach(s => {
        const id = slotId(wk, w, i, s);
        if (!id) return;
        planned++; areas[byId[id].a].p++;
        if (isDone(w, d.k, s)) { done++; areas[byId[id].a].d++; }
      });
    });
    return { planned, done, areas, busyDays };
  }

  /* ---------- materiales ---------- */
  function materialsFor(wk, onlyIdx) {
    const w = getWeek(wk, false), map = new Map();
    DAYS.forEach((d, i) => {
      if (!dayActive(wk, i) || isBusy(w, d.k)) return;
      if (onlyIdx != null && i !== onlyIdx) return;
      w.plan[d.k].forEach(id => {
        if (!id) return;
        byId[id].mat.forEach(m => {
          if (/^Ninguno/i.test(m)) return;
          if (!map.has(m)) map.set(m, []);
          const uses = map.get(m), label = `${byId[id].n} (${d.n.slice(0, 3).toLowerCase()})`;
          if (!uses.includes(label)) uses.push(label);
        });
      });
    });
    return [...map.entries()].map(([m, uses]) => ({ m, uses, have: !!w.mats[m] }));
  }
  function matList(wk, items) {
    if (!items.length) return '<p class="sub">No se necesitan materiales: son juegos solo con tu voz y tus manos.</p>';
    return `<ul class="mats">${items.map((x, n) => `<li><label class="mat" for="mat-${wk}-${n}">
      <input type="checkbox" id="mat-${wk}-${n}" data-mat="${esc(x.m)}" data-wk="${wk}"${x.have ? ' checked' : ''}>
      <span class="box">${ICON.check}</span><span><span class="mat-n">${esc(x.m)}</span><span class="mat-u">Para: ${esc(x.uses.join(', '))}</span></span></label></li>`).join('')}</ul>`;
  }

  /* ---------- piezas de vista ---------- */
  const chip = a => `<span class="chip" data-area="${a.a}">${AREAS[a.a].short}</span>`;
  const ctxData = (wk, day, slot) => `data-wk="${wk}" data-day="${day}" data-slot="${slot}"`;
  const rateBadge = id => rating(id) === 1 ? `<span class="fav" title="Le encantó">${ICON.heart}</span>` : '';
  function rateButtons(id, compact) {
    const v = rating(id);
    return `<div class="rate${compact ? ' compact' : ''}" role="group" aria-label="¿Le gustó?">
      ${compact ? '<span class="rate-q">¿Le gustó?</span>' : ''}
      <button class="btn rate-btn" data-act="rate" data-id="${id}" data-v="1" aria-pressed="${v === 1}">${v === 1 ? ICON.heart : ICON.heartO}Le encantó</button>
      <button class="btn rate-btn" data-act="rate" data-id="${id}" data-v="-1" aria-pressed="${v === -1}">${ICON.down}No le gustó</button></div>`;
  }
  function currentMoment() {
    const n = now(), mins = n.getHours() * 60 + n.getMinutes();
    const t = state.rem.map(s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; });
    let cur = 0; t.forEach((x, i) => { if (mins >= x - 30) cur = i; });
    return cur;
  }

  function slotCard(wk, i, s, opts) {
    const w = getWeek(wk, isCurrentOrPast(wk)), d = DAYS[i], m = MOMENTS[s], id = slotId(wk, w, i, s);
    const busy = isBusy(w, d.k), mark = canMark(wk, i);
    const now = opts && opts.now === s ? '<span class="tag">Ahora</span>' : '';
    if (!id) {
      return `<li class="slot-card">
        <button class="tile tile-empty" data-act="pick" ${ctxData(wk, d.k, s)} aria-label="Elegir juego: ${momentName(s)}">${ICON.plus}</button>
        <div><p class="eyebrow">${m.n} · ${m.d}</p>${now}<h3>Sin juego</h3>
        <div class="actions"><button class="btn primary" data-act="pick" ${ctxData(wk, d.k, s)}>Elegir juego</button></div></div></li>`;
    }
    const a = byId[id], dn = isDone(w, d.k, s);
    return `<li class="slot-card${dn ? ' is-done' : ''}">
      <button class="tile" data-area="${a.a}" data-act="open" data-id="${a.id}" ${ctxData(wk, d.k, s)} aria-label="Ver cómo se hace: ${esc(a.n)}">${art(a.id)}${dn ? `<span class="badge">${ICON.check}</span>` : ''}${rateBadge(a.id)}</button>
      <div><p class="eyebrow">${m.n} · ${busy ? 'Rápido, sin materiales' : m.d}</p>${now}<h3>${esc(a.n)}</h3>
        <p class="meta">${chip(a)}<span>${busy ? '2 min' : `${a.min} min`}</span></p>
        <div class="actions">
          <button class="btn" data-act="open" data-id="${a.id}" ${ctxData(wk, d.k, s)}>Cómo se hace</button>
          ${mark ? `<button class="btn check" data-act="done" ${ctxData(wk, d.k, s)} aria-pressed="${dn}">${ICON.check}${dn ? 'Hecho' : 'Marcar hecho'}</button>` : ''}
        </div>
        ${dn ? rateButtons(a.id, true) : ''}</div></li>`;
  }

  /* ---------- Hoy ---------- */
  function viewHoy() {
    const t = todayIso();
    if (t < startIso()) return viewBeforeStart();
    const wk = weekKey(), i = todayIdx(), d = DAYS[i];
    const w = getWeek(wk, true);
    const busy = isBusy(w, d.k);
    let planned = 0, done = 0;
    [0, 1, 2].forEach(s => { if (slotId(wk, w, i, s)) { planned++; if (isDone(w, d.k, s)) done++; } });
    const pct = planned ? Math.round((done / planned) * 100) : 0;
    const sub = planned === 0 ? 'Hoy no hay juegos en el plan. Elige uno abajo.'
      : done === planned ? `¡Listo! Hicieron ${planned === 1 ? 'el juego' : `los ${planned} juegos`} de hoy. 🎉`
      : `${done} de ${planned} juegos hechos`;
    const cur = currentMoment();
    let summary = '';
    if (i === 0) {
      const pk = iso(addDays(fromIso(wk), -7));
      if (state.weeks[pk]) {
        const ps = weekStats(pk);
        if (ps.planned) summary = `<aside class="note-card"><h2>${ICON.spark}La semana pasada</h2>
          <p>Hicieron <strong>${ps.done} de ${ps.planned}</strong> juegos. ${ps.done >= ps.planned * 0.7 ? '¡Qué buena semana!' : 'Cada juego cuenta, esta semana va otra vez.'}</p>
          <a class="link" href="#diario">Ver resumen de semanas</a></aside>`;
      }
    }
    return `<section class="hero"><p class="eyebrow">Hoy</p><h1 class="title">${longDate(now())}</h1><p class="sub">${sub}</p>
      <div class="bar" role="progressbar" aria-label="Juegos hechos hoy" aria-valuemin="0" aria-valuemax="${planned}" aria-valuenow="${done}"><span style="width:${pct}%"${pct === 0 ? ' data-zero' : ''}></span></div>
      <button class="busy-toggle" data-act="busy" data-wk="${wk}" data-day="${d.k}" aria-pressed="${busy}">
        <span class="busy-ic">${ICON.bolt}</span><span><strong>Día ocupado</strong><small>${busy ? 'Activado: 3 juegos de 2 minutos sin materiales' : 'Cambia a juegos de 2 minutos sin materiales'}</small></span><span class="switch" aria-hidden="true"></span>
      </button></section>
      ${summary}
      <ul class="list">${[0, 1, 2].map(s => slotCard(wk, i, s, { now: cur })).join('')}</ul>
      <aside class="tip"><h2>${ICON.heart}Consejo del día</h2><p>${esc(TIPS[dayOfYear() % TIPS.length])}</p></aside>`;
  }

  function viewBeforeStart() {
    const sd = fromIso(startIso()), wk = weekKeyOf(sd), i = (sd.getDay() + 6) % 7;
    const tomorrow = iso(addDays(now(), 1)) === startIso();
    const when = tomorrow ? 'mañana' : `el ${longDate(sd).toLowerCase()}`;
    const mats = materialsFor(wk, i);
    return `<section class="hero"><p class="eyebrow">Hoy · ${longDate(now())}</p>
      <h1 class="title">El plan empieza ${tomorrow ? 'mañana' : 'pronto'} 🌙</h1>
      <p class="sub">Hoy descansan. Los juegos empiezan ${when}. Aprovecha para juntar los materiales.</p></section>
      <h2 class="section-h">Juegos de ${tomorrow ? 'mañana' : longDate(sd).toLowerCase()}</h2>
      <ul class="list">${[0, 1, 2].map(s => slotCard(wk, i, s)).join('')}</ul>
      <section class="panel"><h2 class="section-h">${ICON.bag}Materiales para ${tomorrow ? 'mañana' : 'ese día'}</h2>${matList(wk, mats)}
      <a class="link" href="#semana">Ver la lista de toda la semana</a></section>`;
  }

  /* ---------- Semana ---------- */
  let weekView = 'this';
  function viewSemana() {
    const wk = weekView === 'next' ? nextWeekKey() : weekKey();
    const w = getWeek(wk, weekView === 'this');
    const stats = weekStats(wk), ti = weekView === 'this' ? todayIdx() : -1;
    const mats = materialsFor(wk), have = mats.filter(x => x.have).length;
    const months = weekAge(wk);
    const newGames = ACTIVITIES.filter(a => a.age[0] > 12 && a.age[0] === months);
    const maxA = Math.max(1, ...AREA_KEYS.map(k => stats.areas[k].p));

    const resumen = `<section class="panel resumen" aria-label="Resumen de la semana">
      <div class="res-top"><div><p class="eyebrow">${weekView === 'this' ? 'Resumen de la semana' : 'Lo que viene'}</p>
        <p class="big"><strong>${weekView === 'this' ? stats.done : stats.planned}</strong>${weekView === 'this' ? ` de ${stats.planned} juegos hechos` : ' juegos planeados'}</p></div>
        <button class="btn" data-act="mats" data-wk="${wk}">${ICON.bag}Materiales <b>${have}/${mats.length}</b></button></div>
      <ul class="area-bars">${AREA_KEYS.map(k => {
        const a = stats.areas[k];
        return `<li data-area="${k}"><span class="ab-n">${AREAS[k].short}</span><span class="ab-track"><span class="ab-p" style="width:${(a.p / maxA) * 100}%"><span class="ab-d" style="width:${a.p ? (a.d / a.p) * 100 : 0}%"></span></span></span><span class="ab-v">${weekView === 'this' ? `${a.d}/${a.p}` : a.p}</span></li>`;
      }).join('')}</ul>
      ${newGames.length ? `<p class="new-note">${ICON.spark}<span>Cumple ${months} meses: se activan ${newGames.length} juegos nuevos.</span></p>` : ''}
    </section>`;

    const days = DAYS.map((d, i) => {
      const date = dateOf(wk, i), active = dayActive(wk, i), busy = isBusy(w, d.k);
      if (!active) {
        return `<li class="day is-off"><div class="day-head"><h2>${d.n}</h2><span class="date">${shortDate(date)}</span>${i === ti ? '<span class="tag">Hoy</span>' : ''}</div>
          <p class="off">El plan empieza el ${longDate(fromIso(startIso())).toLowerCase()}.</p></li>`;
      }
      let pl = 0, dd = 0;
      const slots = MOMENTS.map((m, s) => {
        const id = slotId(wk, w, i, s);
        if (!id) {
          return `<button class="mini empty" data-act="pick" ${ctxData(wk, d.k, s)} aria-label="${d.n}, ${momentName(s)}: elegir juego">
            <span class="tile">${ICON.plus}</span><span class="mini-m">${m.s}</span><span class="mini-n">Elegir juego</span></button>`;
        }
        pl++;
        const a = byId[id], dn = isDone(w, d.k, s); if (dn) dd++;
        return `<button class="mini" data-act="open" data-id="${id}" ${ctxData(wk, d.k, s)} aria-label="${d.n}, ${momentName(s)}: ${esc(a.n)}${dn ? ', hecho' : ''}">
          <span class="tile" data-area="${a.a}">${art(id)}${dn ? `<span class="badge">${ICON.check}</span>` : ''}${rateBadge(id)}</span>
          <span class="mini-m">${m.s}</span><span class="mini-n">${esc(a.n)}</span></button>`;
      }).join('');
      return `<li class="day${i === ti ? ' is-today' : ''}">
        <div class="day-head"><h2>${d.n}</h2><span class="date">${shortDate(date)}</span>${i === ti ? '<span class="tag">Hoy</span>' : ''}${busy ? `<span class="tag busy">${ICON.bolt}Ocupado</span>` : ''}<span class="count">${dd}/${pl}</span></div>
        <div class="slots">${slots}</div></li>`;
    }).join('');

    return `<section class="hero"><p class="eyebrow">Del ${shortDate(dateOf(wk, 0))} al ${shortDate(dateOf(wk, 6))}</p><h1 class="title">Plan de la semana</h1>
      <div class="seg" role="tablist" aria-label="Semana">
        <button role="tab" data-act="weekview" data-v="this" aria-selected="${weekView === 'this'}">Esta semana</button>
        <button role="tab" data-act="weekview" data-v="next" aria-selected="${weekView === 'next'}">Próxima semana</button></div>
      <p class="sub">${weekView === 'this' ? 'Cada lunes llega un plan nuevo. Toca un juego para verlo, cambiarlo o marcarlo.' : 'Así viene la próxima semana. Revisa los materiales y cambia lo que quieras.'}</p></section>
      ${resumen}
      <ol class="days">${days}</ol>
      <div class="week-actions">
        <button class="btn" data-act="shuffle" data-wk="${wk}">${ICON.refresh}Proponer otro plan</button>
        <button class="btn" data-act="reset" data-wk="${wk}">Volver al plan sugerido</button>
        <button class="btn" data-act="clear" data-wk="${wk}">Vaciar semana</button>
      </div>`;
  }

  /* ---------- Juegos ---------- */
  let filter = 'all';
  function card(a, months) {
    const later = months < a.age[0];
    const isNew = !later && a.age[0] > 12 && months - a.age[0] <= 1;
    return `<li><button class="card${later ? ' is-later' : ''}" data-act="open" data-id="${a.id}">
      <span class="tile" data-area="${a.a}">${art(a.id)}${rateBadge(a.id)}${isNew ? '<span class="tag new">Nuevo</span>' : ''}</span>
      <span class="card-n">${esc(a.n)}</span>
      <span class="card-meta" data-area="${a.a}"><i class="dot"></i>${later ? `Desde los ${a.age[0]} meses` : `${AREAS[a.a].short} · ${a.min} min`}</span></button></li>`;
  }
  function viewJuegos() {
    const months = ageNow();
    const match = a => filter === 'all' || (filter === 'fav' ? rating(a.id) === 1 : a.a === filter);
    const now = ACTIVITIES.filter(a => match(a) && fits(a, months));
    const later = ACTIVITIES.filter(a => match(a) && months < a.age[0]);
    const chips = [['all', 'Todos'], ['fav', 'Le encantan']].concat(AREA_KEYS.map(k => [k, AREAS[k].short]))
      .map(([k, l]) => `<button class="fchip"${AREAS[k] ? ` data-area="${k}"` : ''} data-act="filter" data-f="${k}" aria-pressed="${filter === k}">${k === 'fav' ? ICON.heart : ''}${l}</button>`).join('');
    return `<section class="hero"><p class="eyebrow">${ACTIVITIES.filter(a => fits(a, months)).length} juegos para sus ${months} meses</p><h1 class="title">Juegos</h1>
      <p class="sub">Toca un juego para ver cómo se hace y agregarlo al plan. Los juegos nuevos se activan solos según su edad.</p></section>
      <div class="filters" role="group" aria-label="Filtrar">${chips}</div>
      ${now.length ? `<ul class="grid">${now.map(a => card(a, months)).join('')}</ul>` : `<p class="empty-msg">${filter === 'fav' ? 'Todavía no hay favoritos. Marca "Le encantó" en un juego después de hacerlo.' : 'No hay juegos en este grupo.'}</p>`}
      ${later.length ? `<h2 class="section-h">Se activan más adelante</h2><ul class="grid">${later.map(a => card(a, months)).join('')}</ul>` : ''}`;
  }

  /* ---------- Diario ---------- */
  let mileGroup = null;
  function viewDiario() {
    const months = ageNow();
    const groups = Object.keys(MILESTONES).map(Number);
    if (mileGroup == null) mileGroup = groups.filter(g => g <= months).pop() || groups[0];
    const list = MILESTONES[mileGroup];
    const got = list.filter((_, n) => state.miles[`${mileGroup}-${n}`] && state.miles[`${mileGroup}-${n}`].d).length;
    const entries = Object.entries(state.diary).filter(([, e]) => !e.del).sort((a, b) => (b[1].date + b[1].t).localeCompare(a[1].date + a[1].t));
    const weeks = Object.keys(state.weeks).filter(k => k <= weekKey()).sort().reverse()
      .map(k => ({ k, s: weekStats(k) })).filter(x => x.s.planned);

    return `<section class="hero"><p class="eyebrow">${ageText()}</p><h1 class="title">Diario de ${BABY.name}</h1>
      <p class="sub">Sus logros, sus primeras veces y cómo van las semanas.</p></section>

      <section class="panel"><h2 class="section-h">${ICON.spark}Anotar un logro</h2>
        <form id="diary-form" class="diary-form">
          <label class="field" for="diary-text"><span>¿Qué pasó?</span>
            <textarea id="diary-text" rows="2" maxlength="280" placeholder="Hoy dio 3 pasitos sola" required></textarea></label>
          <div class="row"><label class="field" for="diary-date"><span>Fecha</span><input type="date" id="diary-date" value="${todayIso()}" max="${todayIso()}" required></label>
          <button class="btn primary" type="submit">${ICON.plus}Guardar</button></div>
        </form>
        ${entries.length ? `<ul class="entries">${entries.map(([id, e]) => `<li><span class="e-date">${shortDate(fromIso(e.date))}</span><p>${esc(e.text)}</p>
          <button class="icon-btn" data-act="del-entry" data-id="${id}" aria-label="Borrar: ${esc(e.text)}">${ICON.trash}</button></li>`).join('')}</ul>`
          : '<p class="empty-msg">Aquí aparecerán sus primeras veces: su primera palabra, sus primeros pasos…</p>'}
      </section>

      <section class="panel"><h2 class="section-h">${ICON.check}Hitos del desarrollo</h2>
        <div class="seg small" role="tablist" aria-label="Edad">${groups.map(g => `<button role="tab" data-act="milegroup" data-g="${g}" aria-selected="${g === mileGroup}">${g} meses</button>`).join('')}</div>
        <p class="sub">${got} de ${list.length} logrados. Lo que la mayoría de bebés ya hace a los ${mileGroup} meses, según los CDC. Cada bebé tiene su ritmo.</p>
        <ul class="miles">${list.map(([area, text], n) => {
          const key = `${mileGroup}-${n}`, m = state.miles[key], ok = m && m.d;
          return `<li><label class="mile" for="mile-${key}" data-area="${area}"><input type="checkbox" id="mile-${key}" data-mile="${key}"${ok ? ' checked' : ''}>
            <span class="box">${ICON.check}</span><span class="mile-t">${esc(text)}${ok ? `<small>Logrado el ${shortDate(fromIso(m.d))}</small>` : ''}</span><i class="dot"></i></label></li>`;
        }).join('')}</ul>
        <p class="hint">Si no logra algunos de estos hitos o pierde algo que ya hacía, coméntalo en su control de crecimiento (CRED) o con su pediatra.</p>
      </section>

      <section class="panel"><h2 class="section-h">${ICON.cal}Semanas</h2>
        ${weeks.length ? `<ul class="weeks">${weeks.map(({ k, s }) => {
          const p = Math.round((s.done / s.planned) * 100);
          return `<li><span class="w-n">${k === weekKey() ? 'Esta semana' : `Semana del ${shortDate(fromIso(k))}`}</span><span class="w-bar"><span style="width:${p}%"></span></span><span class="w-v">${s.done}/${s.planned}</span></li>`;
        }).join('')}</ul>` : '<p class="empty-msg">Cuando empiecen los juegos, aquí verás cuántos hicieron cada semana.</p>'}
      </section>`;
  }

  /* ---------- hojas ---------- */
  function sheetHead(eyebrow) {
    return `<div class="grab" aria-hidden="true"></div><div class="sheet-head"><p class="eyebrow">${eyebrow}</p>
      <button class="x" data-act="close" aria-label="Cerrar">${ICON.close}</button></div>`;
  }
  function adderForm(a) {
    const ds = Math.max(0, MOMENTS.findIndex(m => m.areas.includes(a.a)));
    const opts = (wk, label) => DAYS.map((d, i) => dayActive(wk, i) && iso(dateOf(wk, i)) >= todayIso()
      ? `<label class="opt"><input type="radio" name="day" value="${wk}|${d.k}" id="ad-${wk}-${d.k}"><span>${d.n.slice(0, 3)} ${dateOf(wk, i).getDate()}</span></label>` : '').join('');
    return `<form class="adder" id="adder" data-id="${a.id}" hidden>
      <fieldset><legend>Esta semana</legend><div class="opts">${opts(weekKey()) || '<span class="hint">No quedan días esta semana.</span>'}</div></fieldset>
      <fieldset><legend>Próxima semana</legend><div class="opts">${opts(nextWeekKey())}</div></fieldset>
      <fieldset><legend>Momento</legend><div class="opts">${MOMENTS.map((m, s) => `<label class="opt"><input type="radio" name="slot" value="${s}" id="ad-s${s}"${s === ds ? ' checked' : ''}><span>${m.n}</span></label>`).join('')}</div></fieldset>
      <p class="hint" id="adder-hint" aria-live="polite">Elige un día.</p>
      <div><button class="btn primary" type="submit">${ICON.check}Guardar en el plan</button></div></form>`;
  }
  function detailHTML(a, ctx) {
    let actions, eyebrow = `Juego ${a.id} de ${ACTIVITIES.length}`;
    if (ctx) {
      const w = getWeek(ctx.wk, false), i = DAYS.findIndex(d => d.k === ctx.day), busy = isBusy(w, ctx.day);
      const dn = isDone(w, ctx.day, ctx.slot), mark = canMark(ctx.wk, i);
      eyebrow = `${dayName(ctx.day)} ${dateOf(ctx.wk, i).getDate()} · ${MOMENTS[ctx.slot].n}`;
      actions = `<div class="actions">
        ${mark ? `<button class="btn check" data-act="done" ${ctxData(ctx.wk, ctx.day, ctx.slot)} aria-pressed="${dn}">${ICON.check}${dn ? 'Hecho' : 'Marcar hecho'}</button>` : ''}
        ${busy ? '' : `<button class="btn" data-act="pick" ${ctxData(ctx.wk, ctx.day, ctx.slot)}>Cambiar juego</button>
        <button class="btn" data-act="remove" ${ctxData(ctx.wk, ctx.day, ctx.slot)}>Quitar</button>`}</div>`;
    } else {
      actions = `<div class="actions"><button class="btn primary" data-act="adder" aria-expanded="false" aria-controls="adder">${ICON.plus}Agregar al plan</button></div>${adderForm(a)}`;
    }
    const months = ageNow();
    const ageNote = months < a.age[0] ? `<p class="note">Este juego se activa a los ${a.age[0]} meses. Puedes probarlo antes si ves que ya está lista.</p>` : '';
    const note = a.care ? `<p class="note care"><strong>Cuidado:</strong> ${esc(a.care)}</p>` : `<p class="note"><strong>Consejo:</strong> ${esc(withName(a.tip || ''))}</p>`;
    return `${sheetHead(eyebrow)}
      <div class="tile hero-art" data-area="${a.a}">${art(a.id)}</div>
      <h2 id="sheet-title">${esc(a.n)}</h2>
      <p class="meta">${chip(a)}<span>${AREAS[a.a].full} · ${a.min} min${a.age[0] > 12 ? ` · desde ${a.age[0]} meses` : ''}</span></p>
      ${actions}${ageNote}
      ${rateButtons(a.id, false)}
      <section class="sec"><h3>Beneficios</h3><ul class="benefits">${a.ben.map(b => `<li>${ICON.heart}<span>${esc(b)}</span></li>`).join('')}</ul></section>
      <section class="sec"><h3>Materiales</h3><ul class="materials">${a.mat.map(m => `<li>${esc(m)}</li>`).join('')}</ul></section>
      <section class="sec"><h3>Cómo se hace</h3><ol class="steps">${a.steps.map(s => `<li><span>${esc(withName(s))}</span></li>`).join('')}</ol></section>
      ${note}`;
  }

  let pickFilter = 'sug';
  function pickerHTML(wk, day, slot) {
    const m = MOMENTS[slot], cur = getWeek(wk, false).plan[day][slot], months = weekAge(wk);
    const base = ACTIVITIES.filter(a => fits(a, months));
    const list = pickFilter === 'sug' ? base.filter(a => m.areas.includes(a.a))
      : pickFilter === 'all' ? base : pickFilter === 'fav' ? base.filter(a => rating(a.id) === 1) : base.filter(a => a.a === pickFilter);
    const opts = [['sug', 'Sugeridos'], ['all', 'Todos'], ['fav', 'Le encantan']].concat(AREA_KEYS.map(k => [k, AREAS[k].short]));
    const chips = opts.map(([k, l]) => `<button class="fchip"${AREAS[k] ? ` data-area="${k}"` : ''} data-act="pfilter" data-f="${k}" aria-pressed="${pickFilter === k}">${l}</button>`).join('');
    const rows = list.map(a => `<li><button data-act="assign" data-id="${a.id}" ${ctxData(wk, day, slot)}${a.id === cur ? ' aria-current="true"' : ''}>
        <span class="tile" data-area="${a.a}">${art(a.id)}</span>
        <span><span class="pick-n">${esc(a.n)}${rating(a.id) === 1 ? ' ❤️' : ''}</span><span class="pick-a">${AREAS[a.a].short} · ${a.min} min${rating(a.id) === -1 ? ' · no le gustó' : ''}</span></span>
        ${a.id === cur ? '<span class="tag">Actual</span>' : ''}</button></li>`).join('');
    return `${sheetHead(`${dayName(day)} · ${m.n}`)}
      <h2 id="sheet-title">Elegir juego</h2>
      <p class="sub">Sugeridos ${momentName(slot)}: ${m.d.toLowerCase()}.</p>
      <div class="filters" role="group" aria-label="Filtrar juegos">${chips}</div>
      ${list.length ? `<ul class="pick">${rows}</ul>` : '<p class="empty-msg">No hay juegos en este grupo.</p>'}`;
  }

  function matsHTML(wk) {
    const items = materialsFor(wk), have = items.filter(x => x.have).length;
    return `${sheetHead(`Del ${shortDate(dateOf(wk, 0))} al ${shortDate(dateOf(wk, 6))}`)}
      <h2 id="sheet-title">Materiales de la semana</h2>
      <p class="sub">${have} de ${items.length} listos. Marca lo que ya tienes en casa.</p>
      ${matList(wk, items)}`;
  }

  function settingsHTML() {
    let share;
    if (!CAN_SYNC) {
      share = `<p class="sub">Para compartir el plan con tu familia, usa la app instalada en tu celular (la versión de GitHub Pages). Aquí, en la vista previa, no se puede conectar a internet.</p>`;
    } else if (state.family) {
      share = `<p class="sub">Comparte este código con tu familia. En su celular: Ajustes → Compartir → Unirme con un código.</p>
        <div class="code-box"><span class="code" id="fam-code">${esc(state.family)}</span>
        <button class="btn" data-act="copy-code">${ICON.copy}Copiar</button></div>
        <p class="sync-line" id="sync-line">${syncText()}</p>
        <div class="actions"><button class="btn" data-act="sync-now">${ICON.refresh}Sincronizar ahora</button>
        <button class="btn" data-act="leave">Dejar de compartir</button></div>`;
    } else {
      share = `<p class="sub">Así los dos ven el mismo plan, los juegos hechos, los favoritos y el diario desde su propio celular.</p>
        <div class="actions"><button class="btn primary" data-act="create-family">${ICON.people}Crear código familiar</button></div>
        <form id="join-form" class="join"><label class="field" for="join-code"><span>¿Ya tienen un código?</span>
          <input id="join-code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="AIUNI-XXXX-XXXX" maxlength="15" required></label>
          <button class="btn" type="submit">Unirme</button></form>
        <p class="hint" id="join-msg" aria-live="polite"></p>`;
    }
    return `${sheetHead('Ajustes')}
      <h2 id="sheet-title">Ajustes</h2>
      <section class="sec"><h3>${ICON.people} Compartir con tu familia</h3>${share}</section>
      <section class="sec"><h3>${ICON.bell} Recordatorios</h3>
        <p class="sub">Elige a qué hora suele ser cada momento. La app marca "Ahora" en el juego que toca.</p>
        <div class="times">${MOMENTS.map((m, s) => `<label class="field" for="rem-${s}"><span>${m.n}</span><input type="time" id="rem-${s}" data-rem="${s}" value="${state.rem[s]}"></label>`).join('')}</div>
        ${IS_APP ? `<div class="actions"><button class="btn primary" data-act="ics">${ICON.cal}Agregar avisos a mi calendario</button></div>
          <p class="hint">Se descarga un archivo con 3 avisos diarios. Ábrelo y tu celular te pregunta si quieres agregarlos al calendario. En iPhone, hazlo desde Safari. Si cambias las horas, vuelve a agregarlos y borra los anteriores.</p>`
          : '<p class="hint">Los avisos en el calendario se agregan desde la app instalada en tu celular.</p>'}
      </section>
      <section class="sec"><h3>${ICON.cal} Inicio del plan</h3>
        <label class="field" for="start-date"><span>Los juegos empiezan el</span><input type="date" id="start-date" value="${startIso()}"></label>
      </section>`;
  }

  /* ---------- render ---------- */
  const VIEWS = { hoy: viewHoy, semana: viewSemana, juegos: viewJuegos, diario: viewDiario };
  const current = () => (VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'hoy');
  function render() {
    const v = current();
    const y = window.scrollY;
    $('#view').innerHTML = VIEWS[v]();
    window.scrollTo(0, y);
    document.querySelectorAll('.tab').forEach(t => {
      if (t.dataset.view === v) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    });
    $('#age').textContent = ageText();
  }

  let lastFocus = null, sheetCtx = null;
  function sheetBody() {
    if (!sheetCtx) return '';
    switch (sheetCtx.type) {
      case 'pick': return pickerHTML(sheetCtx.wk, sheetCtx.day, sheetCtx.slot);
      case 'mats': return matsHTML(sheetCtx.wk);
      case 'settings': return settingsHTML();
      default: return detailHTML(byId[sheetCtx.id], sheetCtx.ctx);
    }
  }
  function openSheet(ctx) {
    if ($('#sheet').hidden) lastFocus = document.activeElement;
    sheetCtx = ctx;
    const sh = $('#sheet');
    sh.innerHTML = sheetBody();
    sh.hidden = false; $('#scrim').hidden = false;
    document.body.classList.add('locked');
    sh.scrollTop = 0;
    const x = sh.querySelector('.x'); if (x) x.focus({ preventScroll: true });
  }
  function refreshSheet(focusSel) {
    if (!sheetCtx) return;
    const sh = $('#sheet'), top = sh.scrollTop;
    const adderOpen = sh.querySelector('#adder:not([hidden])');
    sh.innerHTML = sheetBody();
    if (adderOpen) { const f = sh.querySelector('#adder'); if (f) { f.hidden = false; const b = sh.querySelector('[data-act="adder"]'); if (b) b.setAttribute('aria-expanded', 'true'); } }
    sh.scrollTop = top;
    const f = focusSel && sh.querySelector(focusSel); if (f) f.focus({ preventScroll: true });
  }
  function closeSheet() {
    $('#sheet').hidden = true; $('#scrim').hidden = true;
    document.body.classList.remove('locked');
    sheetCtx = null;
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  }

  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }
  const armedBtns = {};
  function armed(btn, key, fn) {
    if (armedBtns[key]) { clearTimeout(armedBtns[key]); delete armedBtns[key]; fn(); return; }
    const original = btn.innerHTML;
    btn.textContent = 'Toca otra vez para confirmar';
    btn.classList.add('warn');
    armedBtns[key] = setTimeout(() => { btn.innerHTML = original; btn.classList.remove('warn'); delete armedBtns[key]; }, 3500);
  }

  function updateHint() {
    const f = $('#adder'); if (!f) return;
    const dv = f.elements.day.value, slot = +f.elements.slot.value;
    if (!dv) { $('#adder-hint').textContent = 'Elige un día.'; return; }
    const [wk, day] = dv.split('|'), cur = getWeek(wk, false).plan[day][slot];
    $('#adder-hint').textContent = !cur ? 'Ese espacio está libre.' : cur === +f.dataset.id ? 'Ya está en ese lugar del plan.' : `Reemplazará a: ${byId[cur].n}`;
  }

  /* ---------- recordatorios en el calendario ---------- */
  function downloadIcs() {
    const pad = n => String(n).padStart(2, '0');
    const d = new Date(), stamp = `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
    const first = (startIso() > todayIso() ? startIso() : todayIso()).replace(/-/g, '');
    const ev = MOMENTS.map((m, s) => [
      'BEGIN:VEVENT', `UID:aiuni-juega-${m.k}-${hashStr(state.rem[s])}@aiuni-juega`, `DTSTAMP:${stamp}`,
      `DTSTART:${first}T${state.rem[s].replace(':', '')}00`, 'DURATION:PT15M', 'RRULE:FREQ=DAILY',
      `SUMMARY:${BABY.name} Juega: ${m.n}`, `DESCRIPTION:Hora del juego (${m.d.toLowerCase()}). Abre la app para ver cuál toca hoy.`,
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'TRIGGER:PT0M', `DESCRIPTION:${BABY.name} Juega: ${m.n}`, 'END:VALARM', 'END:VEVENT'
    ].join('\r\n')).join('\r\n');
    const ics = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Aiuni Juega//ES\r\nCALSCALE:GREGORIAN\r\nMETHOD:PUBLISH\r\n${ev}\r\nEND:VCALENDAR\r\n`;
    const url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'aiuni-juega-avisos.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Abre el archivo para agregar los avisos');
  }

  /* ---------- compartir (sincronización) ---------- */
  let syncing = false, syncErr = '', syncTimer = null;
  function syncText() {
    if (syncing) return 'Sincronizando…';
    if (syncErr) return syncErr;
    return `Sincronizado ${ago(state.lastSync)}.`;
  }
  function showSync() { const el = $('#sync-line'); if (el) el.textContent = syncText(); }
  async function rpc(fn, body) {
    const r = await fetch(`${CFG.sbUrl}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: { apikey: CFG.sbKey, Authorization: `Bearer ${CFG.sbKey}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error(`${r.status}`);
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  }
  const shared = () => ({ start: state.start, weeks: state.weeks, ratings: state.ratings, diary: state.diary, miles: state.miles });
  const MAPS = ['weeks', 'ratings', 'diary', 'miles'];
  function merge(remote) {
    if (!remote) return false;
    let changed = false;
    if (remote.start && remote.start.v && (remote.start.t || 0) > (state.start.t || 0)) { state.start = remote.start; changed = true; }
    MAPS.forEach(name => {
      const rm = obj(remote[name]);
      Object.keys(rm).forEach(k => {
        const loc = state[name][k], rem = rm[k];
        if (!rem) return;
        if (!loc || (rem.t || 0) > (loc.t || 0)) { state[name][k] = name === 'weeks' ? normWeek(rem) : rem; changed = true; }
      });
    });
    return changed;
  }
  function localAhead(remote) {
    if (!remote) return true;
    if ((state.start.t || 0) > ((remote.start && remote.start.t) || 0)) return true;
    return MAPS.some(name => {
      const rm = obj(remote[name]);
      return Object.keys(state[name]).some(k => { const l = state[name][k]; return (l.t || 0) > 0 && (!rm[k] || (l.t || 0) > (rm[k].t || 0)); });
    });
  }
  async function sync() {
    if (!CAN_SYNC || !state.family || syncing || !navigator.onLine) return;
    syncing = true; syncErr = ''; showSync();
    try {
      const res = await rpc('aiuni_juega_leer', { p_codigo: state.family });
      const remote = res && res.datos;
      const changed = merge(remote);
      if (localAhead(remote)) await rpc('aiuni_juega_guardar', { p_codigo: state.family, p_datos: shared() });
      state.dirty = false; state.lastSync = Date.now(); persist();
      if (changed) { render(); if (sheetCtx && sheetCtx.type !== 'settings') refreshSheet(); }
    } catch (e) {
      syncErr = 'No se pudo sincronizar. Se intentará de nuevo cuando haya internet.';
    } finally { syncing = false; showSync(); }
  }
  function queueSync() { if (!CAN_SYNC || !state.family) return; clearTimeout(syncTimer); syncTimer = setTimeout(sync, 1500); }
  function newCode() {
    const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', b = new Uint8Array(8);
    crypto.getRandomValues(b);
    const s = [...b].map(x => abc[x % abc.length]).join('');
    return `AIUNI-${s.slice(0, 4)}-${s.slice(4)}`;
  }
  const normCode = s => s.toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^AIUNI/, '').replace(/^(.{4})(.{4}).*$/, 'AIUNI-$1-$2');

  /* ---------- eventos ---------- */
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.dataset.act, id = +b.dataset.id, wk = b.dataset.wk, day = b.dataset.day;
    const slot = b.dataset.slot != null ? +b.dataset.slot : null;
    switch (act) {
      case 'open':
        openSheet({ type: 'detail', id, ctx: wk ? { wk, day, slot } : null });
        break;
      case 'pick':
        pickFilter = 'sug';
        openSheet({ type: 'pick', wk, day, slot });
        break;
      case 'pfilter':
        pickFilter = b.dataset.f; refreshSheet(`[data-act="pfilter"][data-f="${pickFilter}"]`);
        break;
      case 'assign': {
        const w = editWeek(wk);
        w.plan[day][slot] = id; delete w.done[doneKey(day, slot, false)];
        save(); closeSheet(); render();
        toast(`${byId[id].n}: ${dayName(day).toLowerCase()}, ${momentName(slot)}`);
        break;
      }
      case 'remove': {
        const w = editWeek(wk);
        w.plan[day][slot] = null; delete w.done[doneKey(day, slot, false)];
        save(); closeSheet(); render(); toast('Juego quitado del plan');
        break;
      }
      case 'done': {
        const w = editWeek(wk), k = doneKey(day, slot, isBusy(w, day)), v = !w.done[k];
        if (v) w.done[k] = true; else delete w.done[k];
        save(); render();
        if (sheetCtx) refreshSheet('[data-act="done"]');
        toast(v ? '¡Bien hecho! 🎉 ¿Le gustó?' : 'Marcado como pendiente');
        break;
      }
      case 'rate': {
        const v = +b.dataset.v, nv = rating(id) === v ? 0 : v;
        state.ratings[id] = { v: nv, t: Date.now() };
        save(); render(); if (sheetCtx) refreshSheet(`[data-act="rate"][data-v="${v}"]`);
        toast(nv === 1 ? 'Guardado: le encantó ❤️. Saldrá más seguido.' : nv === -1 ? 'Guardado: casi no saldrá en los próximos planes.' : 'Calificación quitada');
        break;
      }
      case 'busy': {
        const w = editWeek(wk), v = !w.busy[day];
        if (v) w.busy[day] = true; else delete w.busy[day];
        save(); render(); toast(v ? 'Día ocupado: juegos de 2 minutos ⚡' : 'Volviste a los juegos del plan');
        break;
      }
      case 'adder': {
        const f = $('#adder'); f.hidden = !f.hidden;
        b.setAttribute('aria-expanded', String(!f.hidden));
        if (!f.hidden) { updateHint(); f.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
        break;
      }
      case 'filter':
        filter = b.dataset.f; render();
        { const f = document.querySelector(`[data-act="filter"][data-f="${filter}"]`); if (f) f.focus({ preventScroll: true }); }
        break;
      case 'weekview':
        weekView = b.dataset.v; render();
        break;
      case 'mats':
        openSheet({ type: 'mats', wk });
        break;
      case 'milegroup':
        mileGroup = +b.dataset.g; render();
        break;
      case 'del-entry':
        armed(b, 'del-' + b.dataset.id, () => { state.diary[b.dataset.id] = { del: true, t: Date.now() }; save(); render(); toast('Logro borrado'); });
        break;
      case 'shuffle':
        armed(b, 'shuffle', () => { const w = editWeek(wk); w.salt += 1; w.plan = autoPlan(wk, w.salt); w.done = {}; save(); render(); toast('Listo, aquí tienes otro plan'); });
        break;
      case 'reset':
        armed(b, 'reset', () => { const w = editWeek(wk); w.salt = 0; w.plan = autoPlan(wk, 0); w.done = {}; w.busy = {}; save(); render(); toast('Volviste al plan sugerido'); });
        break;
      case 'clear':
        armed(b, 'clear', () => { const w = editWeek(wk); DAYS.forEach(d => { w.plan[d.k] = [null, null, null]; }); w.done = {}; w.busy = {}; save(); render(); toast('Semana vacía. Toca + para elegir juegos'); });
        break;
      case 'settings':
        openSheet({ type: 'settings' });
        break;
      case 'ics':
        downloadIcs();
        break;
      case 'create-family':
        state.family = newCode(); state.dirty = true; persist(); refreshSheet('[data-act="copy-code"]'); sync();
        toast('Código creado. Compártelo con tu familia');
        break;
      case 'copy-code': {
        const code = state.family;
        const fallback = () => { const r = document.createRange(); r.selectNodeContents($('#fam-code')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Código seleccionado: cópialo'); };
        if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => toast('Código copiado'), fallback); else fallback();
        break;
      }
      case 'sync-now':
        sync();
        break;
      case 'leave':
        armed(b, 'leave', () => { state.family = null; persist(); refreshSheet(); toast('Dejaste de compartir. Tus datos siguen en este celular'); });
        break;
      case 'close':
        closeSheet();
        break;
    }
  });

  document.addEventListener('change', e => {
    const t = e.target;
    if (t.closest('#adder')) { updateHint(); return; }
    if (t.dataset.mat) {
      const w = editWeek(t.dataset.wk);
      if (t.checked) w.mats[t.dataset.mat] = true; else delete w.mats[t.dataset.mat];
      save();
      if (sheetCtx && sheetCtx.type === 'mats') { const p = $('#sheet .sub'); const it = materialsFor(t.dataset.wk); if (p) p.textContent = `${it.filter(x => x.have).length} de ${it.length} listos. Marca lo que ya tienes en casa.`; }
      if (current() === 'semana' && !sheetCtx) render();
      return;
    }
    if (t.dataset.mile) {
      state.miles[t.dataset.mile] = { d: t.checked ? todayIso() : null, t: Date.now() };
      save(); render();
      if (t.checked) toast('¡Qué emoción! Logro guardado 🎉');
      return;
    }
    if (t.dataset.rem != null) {
      if (/^\d\d:\d\d$/.test(t.value)) { state.rem[+t.dataset.rem] = t.value; persist(); render(); }
      return;
    }
    if (t.id === 'start-date' && t.value) {
      state.start = { v: t.value, t: Date.now() }; save(); render();
      toast(`El plan empieza el ${longDate(fromIso(t.value)).toLowerCase()}`);
    }
  });

  document.addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target;
    if (f.id === 'adder') {
      const dv = f.elements.day.value, slot = +f.elements.slot.value;
      if (!dv) { $('#adder-hint').textContent = 'Primero elige un día.'; return; }
      const [wk, day] = dv.split('|'), id = +f.dataset.id, w = editWeek(wk);
      w.plan[day][slot] = id; delete w.done[doneKey(day, slot, false)];
      save(); closeSheet(); render();
      toast(`Agregado al ${dayName(day).toLowerCase()}, ${momentName(slot)}`);
    } else if (f.id === 'diary-form') {
      const text = $('#diary-text').value.trim(), date = $('#diary-date').value;
      if (!text || !date) return;
      state.diary[`e${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`] = { date, text, t: Date.now() };
      save(); render(); toast('Logro guardado en su diario 📒');
    } else if (f.id === 'join-form') {
      const code = normCode($('#join-code').value), msg = $('#join-msg');
      if (!/^AIUNI-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code)) { msg.textContent = 'Revisa el código: tiene la forma AIUNI-XXXX-XXXX.'; return; }
      msg.textContent = 'Buscando…';
      try {
        const res = await rpc('aiuni_juega_leer', { p_codigo: code });
        if (!res) { msg.textContent = 'No encontramos ese código. Revisa que esté bien escrito.'; return; }
        state.family = code; merge(res.datos); state.lastSync = Date.now(); persist();
        if (localAhead(res.datos)) await rpc('aiuni_juega_guardar', { p_codigo: code, p_datos: shared() });
        render(); refreshSheet(); toast('¡Listo! Ya comparten el plan 💞');
      } catch (err) { msg.textContent = 'No se pudo conectar. Revisa tu internet e intenta otra vez.'; }
    }
  });

  document.addEventListener('keydown', e => {
    const sh = $('#sheet');
    if (sh.hidden) return;
    if (e.key === 'Escape') { closeSheet(); return; }
    if (e.key === 'Tab') {
      const f = [...sh.querySelectorAll('button, input, textarea, [href], [tabindex]:not([tabindex="-1"])')].filter(el => !el.closest('[hidden]'));
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  window.addEventListener('hashchange', () => { closeSheet(); render(); window.scrollTo(0, 0); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); sync(); } });
  window.addEventListener('online', sync);
  setInterval(() => { if (!document.hidden) sync(); }, 60000);

  $('#brand-name').textContent = `${BABY.name} Juega`;
  render();
  sync();
})();

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
</script>
</body>
</html>
